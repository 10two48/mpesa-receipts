```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M-Pesa Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #168f3c;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #168f3c;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #117331;
        }

        button:disabled {
            background: #999;

            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;

            padding: 12px;

            border-radius: 6px;

            display: none;

            text-align: center;
        }

        .success {
            background: #e8f7ed;

            color: #176b31;
        }

        .error {
            background: #fdeaea;

            color: #a52222;
        }

        .processing {
            background: #fff8df;

            color: #765d00;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>M-Pesa Payment</h1>

    <p class="subtitle">
        Enter your details to make a payment
    </p>


    <form id="paymentForm">

        <label for="name">
            Customer Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            required
        >


        <label for="amount">
            Amount (KSh)
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="1"
            required
        >


        <label for="description">
            Payment Description
        </label>

        <input
            type="text"
            id="description"
            placeholder="e.g. School fees"
        >


        <button
            type="submit"
            id="payButton"
        >
            Pay with M-Pesa
        </button>

    </form>


    <div id="message"></div>

</div>


<script>

const paymentForm =
    document.getElementById("paymentForm");

const payButton =
    document.getElementById("payButton");

const message =
    document.getElementById("message");


/*
    Submit payment
*/

paymentForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const customerName =
            document
                .getElementById("name")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const amount =
            document
                .getElementById("amount")
                .value;


        const description =
            document
                .getElementById("description")
                .value
                .trim();


        /*
            Disable button while payment
            request is being processed.
        */

        payButton.disabled = true;

        payButton.textContent =
            "Sending STK Push...";


        message.style.display =
            "block";

        message.className =
            "processing";

        message.textContent =
            "Sending payment request...";


        try {

            const response =
                await fetch(
                    "/pay",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            customer_name:
                                customerName,

                            phone:
                                phone,

                            amount:
                                amount,

                            description:
                                description

                        })
                    }
                );


            const result =
                await response.json();


            console.log(
                "Server response:",
                result
            );


            /*
                Check whether STK Push
                was successfully sent.
            */

            if (
                response.ok &&
                result.ResponseCode === "0"
            ) {

                message.className =
                    "processing";

                message.textContent =
                    "STK Push sent successfully. " +
                    "Check your phone and enter " +
                    "your M-Pesa PIN.";


                const checkoutRequestId =
                    result.CheckoutRequestID;


                /*
                    Start checking payment status.
                */

                checkPaymentStatus(
                    checkoutRequestId
                );


            } else {

                message.className =
                    "error";

                message.textContent =
                    result.ResponseDescription ||
                    result.message ||
                    "Payment request failed.";


                payButton.disabled =
                    false;

                payButton.textContent =
                    "Pay with M-Pesa";

            }


        } catch (error) {

            console.error(
                "Payment error:",
                error
            );


            message.className =
                "error";

            message.textContent =
                "Could not connect to " +
                "the payment server.";


            payButton.disabled =
                false;

            payButton.textContent =
                "Pay with M-Pesa";

        }

    }
);


/*
    Check payment status
*/

async function checkPaymentStatus(
    checkoutRequestId
) {

    let attempts = 0;

    const maxAttempts = 30;

    let checking = true;


    /*
        Check immediately once,
        then continue every 2 seconds.
    */

    async function checkStatus() {

        if (!checking) {
            return;
        }


        attempts++;


        try {

            const response =
                await fetch(
                    "/payment-status/" +
                    encodeURIComponent(
                        checkoutRequestId
                    )
                );


            const result =
                await response.json();


            console.log(
                "Payment status:",
                result
            );


            /*
                PAYMENT SUCCESS
            */

            if (
                result.found &&
                result.status === "SUCCESS"
            ) {

                /*
                    Stop all further checks.
                */

                checking = false;


                message.className =
                    "success";

                message.textContent =
                    "Payment successful! " +
                    "Opening your receipt...";


                /*
                    Open receipt after
                    a short delay.
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "/receipt/" +
                            result.transaction_id;

                    },
                    800
                );


                return;
            }


            /*
                PAYMENT FAILED
            */

            if (
                result.found &&
                result.status === "FAILED"
            ) {

                checking = false;


                message.className =
                    "error";

                message.textContent =
                    "Payment was not completed.";


                payButton.disabled =
                    false;

                payButton.textContent =
                    "Pay with M-Pesa";


                return;
            }


            /*
                PAYMENT STILL PENDING
            */

            if (
                attempts >= maxAttempts
            ) {

                checking = false;


                message.className =
                    "error";

                message.textContent =
                    "Payment confirmation is taking " +
                    "longer than expected. " +
                    "Please check your transaction later.";


                payButton.disabled =
                    false;

                payButton.textContent =
                    "Pay with M-Pesa";


                return;
            }


            /*
                Continue checking after
                2 seconds.
            */

            setTimeout(
                checkStatus,
                2000
            );


        } catch (error) {

            console.error(
                "Status check error:",
                error
            );


            /*
                Try again unless the
                maximum attempts are reached.
            */

            if (
                attempts < maxAttempts &&
                checking
            ) {

                setTimeout(
                    checkStatus,
                    2000
                );

            } else {

                checking = false;

                message.className =
                    "error";

                message.textContent =
                    "Unable to confirm payment. " +
                    "Please check your transaction later.";


                payButton.disabled =
                    false;

                payButton.textContent =
                    "Pay with M-Pesa";
            }

        }

    }


    /*
        Start checking.
    */

    checkStatus();

}

</script>

</body>

</html>
