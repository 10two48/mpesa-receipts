<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transaction Dashboard</title>

<style>

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 30px;
        color: #222;
    }

    .container {
        max-width: 1250px;
        margin: auto;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
        margin: 0 0 10px;
        color: #666;
        font-size: 14px;
    }

    .card p {
        margin: 0;
        font-size: 26px;
        font-weight: bold;
    }

    .table-container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        overflow-x: auto;
    }

    .filters {
        margin-bottom: 20px;
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
    }

    .filters form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .filters input {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
    }

    .filters button {
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        background: #198754;
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    .filters button:hover {
        background: #146c43;
    }

    .clear-btn {
        padding: 10px 18px;
        border-radius: 5px;
        background: #6c757d;
        color: white;
        text-decoration: none;
        font-size: 14px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
        white-space: nowrap;
    }

    th {
        background: #f8f9fa;
    }

    .success {
        color: green;
        font-weight: bold;
    }

    .failed {
        color: red;
        font-weight: bold;
    }

    .receipt-btn {
        background: #198754;
        color: white;
        padding: 7px 12px;
        text-decoration: none;
        border-radius: 5px;
    }

    .receipt-btn:hover {
        background: #146c43;
    }

    .no-results {
        text-align: center;
        padding: 30px;
        color: #777;
    }

    /* PAGINATION */

    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    .pagination a,
    .pagination span {
        padding: 8px 13px;
        border-radius: 5px;
        text-decoration: none;
        border: 1px solid #ddd;
        background: white;
        color: #333;
        font-size: 14px;
    }

    .pagination a:hover {
        background: #198754;
        color: white;
        border-color: #198754;
    }

    .pagination .current {
        background: #198754;
        color: white;
        border-color: #198754;
        font-weight: bold;
    }

    .pagination .disabled {
        color: #aaa;
        background: #f5f5f5;
    }

    .page-info {
        text-align: center;
        color: #666;
        margin-top: 12px;
        font-size: 14px;
    }

    @media (max-width: 800px) {

        .cards {
            grid-template-columns: 1fr;
        }

        .filters form {
            flex-direction: column;
        }

        .filters input,
        .filters button,
        .clear-btn {
            width: 100%;
            box-sizing: border-box;
        }

    }

</style>
```

</head>

<body>
